<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand cards — source for og.png and the app icons</title>
<!--
  Source artwork for /og.png and /icons/*.png.
  Serve the project (npm start) and screenshot the elements below with any headless browser, e.g.:
    page.goto('http://localhost:8765/tools/brand-cards.html')
    (await page.$('#og')).screenshot({ path: 'og.png' })          // 1200x630
    (await page.$('#icon')).screenshot({ path: 'icons/icon-512.png' })
-->
<style>
  @font-face {
    font-family: 'DM Sans'; font-style: normal; font-weight: 100 1000; font-display: block;
    src: url('/fonts/dm-sans-latin.woff2') format('woff2');
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #9aa7c7; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }

  #og { width: 1200px; height: 630px; background: #dfe5f2; padding: 46px; display: flex; align-items: stretch; gap: 44px; }
  #og .frame { background: #fff; border: 6px solid #000; border-radius: 10px; box-shadow: 14px 14px 0 0 #000; padding: 34px 40px; display: flex; align-items: center; gap: 44px; width: 100%; }
  #og .art { flex: 0 0 360px; display: flex; align-items: center; justify-content: center; }
  #og .art img { width: 360px; height: auto; display: block; }
  #og .copy { flex: 1; min-width: 0; }
  #og .kicker { display: inline-block; background: #ffdc58; border: 4px solid #000; border-radius: 8px; box-shadow: 6px 6px 0 0 #000; padding: 6px 16px; font-weight: 800; font-size: 24px; letter-spacing: .1em; margin-bottom: 26px; }
  #og h1 { font-size: 76px; line-height: .96; font-weight: 900; letter-spacing: -.01em; margin: 0 0 20px; }
  #og p { font-size: 30px; line-height: 1.3; font-weight: 500; margin: 0 0 28px; }
  #og .url { display: inline-block; background: #000; color: #fff; border-radius: 8px; padding: 10px 20px; font-size: 26px; font-weight: 800; letter-spacing: .02em; }

  .icon { background: #ffdc58; display: flex; align-items: center; justify-content: center; }
  #icon { width: 512px; height: 512px; border: 18px solid #000; border-radius: 84px; }
  #icon svg { width: 66%; height: 66%; display: block; }
  /* Full-bleed variant: for maskable icons and the Apple touch icon, which are masked
     by the platform, so the artwork must reach the edges and stay inside the safe zone. */
  #icon-full { width: 512px; height: 512px; }
  #icon-full svg { width: 54%; height: 54%; display: block; }
</style>
</head>
<body>
  <div id="og">
    <div class="frame">
      <div class="art"><img src="/docs/hero.svg" alt=""></div>
      <div class="copy">
        <div class="kicker">165,888 PUZZLES</div>
        <h1>THE<br>GENIUS STAR</h1>
        <p>Roll the dice, fill the star,<br>chase the Golden Star. Free.</p>
        <div class="url">genius-star.vercel.app</div>
      </div>
    </div>
  </div>

  <div id="icon" class="icon">
    <svg viewBox="-52 -52 104 104" xmlns="http://www.w3.org/2000/svg">
      <polygon fill="#000"
        points="0,-50 11.2,-15.5 47.6,-15.5 18.2,5.9 29.4,40.5 0,19.1 -29.4,40.5 -18.2,5.9 -47.6,-15.5 -11.2,-15.5"/>
    </svg>
  </div>

  <div id="icon-full" class="icon">
    <svg viewBox="-52 -52 104 104" xmlns="http://www.w3.org/2000/svg">
      <polygon fill="#000"
        points="0,-50 11.2,-15.5 47.6,-15.5 18.2,5.9 29.4,40.5 0,19.1 -29.4,40.5 -18.2,5.9 -47.6,-15.5 -11.2,-15.5"/>
    </svg>
  </div>
</body>
</html>
